[project]
name = "TARSUS_BC"
version = "0.1.0"
description = "TARSUS pipeline for detecting single amino acid substitutions from MS data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "polars>=1.0",
    "numpy>=1.26",
    "pyteomics>=4.7",
    "pyascore>=1.0",
    "psims>=1.3.6",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "pandas>=2.0",
    "pyarrow>=25.0.0",
]

[project.scripts]
tarsus = "tarsus.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
# `tarsus.assets` holds the substitution-exclusion matrix, the FragPipe workflow
# template and the two 61x19 heatmap masks. It resolved before only because this is
# always an editable install; a real wheel would have shipped without it.
packages = ["tarsus", "tarsus.steps", "tarsus.assets"]

[tool.setuptools.package-data]
"tarsus.assets" = ["*.csv", "*.workflow"]

[dependency-groups]
dev = [
"pytest",
"ruff",
"mypy",
"pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "lsf: tests that require LSF cluster access",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
